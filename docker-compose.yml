x-images:
  # Match Plataberget (glamsterdam-devnet-8), the L1 used by glamsterdam-def-0.
  ethereum-genesis-generator: &ethereum-genesis-generator-image ethpandaops/ethereum-genesis-generator:6.2.0
  geth: &geth-image ethpandaops/geth:glamsterdam-devnet-8
  teku: &teku-image ethpandaops/teku:glamsterdam-devnet-8
  python: &python-image python:3-alpine
  blob-archiver: &blob-archiver-image us-docker.pkg.dev/oplabs-tools-artifacts/images/blob-archiver:edc32e415d15aadfe381b4992be327486734d243
  foundry: &foundry-image ghcr.io/foundry-rs/foundry:v1.7.1
  # Match devnets-private/dev/glamsterdam-defense-0/manifest.yaml.
  op-deployer: &op-deployer-image ${OP_DEPLOYER_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-deployer:v0.7.1}
  op-reth: &op-reth-image us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.4.2
  op-node: &op-node-image us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.19.5-rc.2
  op-batcher: &op-batcher-image us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:71b5fe0865fbd7a798f9b5da7602ec7b0903b9fb

configs:
  values-env:
    content: |
      # Match Plataberget's chain identity, fork versions, slot duration, gas limit,
      # compounding credentials, and BPO schedule. Only the validator count and fork
      # epoch are compressed so the transition is practical on a laptop.
      export CHAIN_ID=7091047534
      export SLOT_DURATION_IN_SECONDS=12
      export NUMBER_OF_VALIDATORS=16384
      export EL_AND_CL_MNEMONIC='test test test test test test test test test test test junk'
      export GENESIS_FORK_VERSION=0x10733183
      export ALTAIR_FORK_VERSION=0x20733183
      export BELLATRIX_FORK_VERSION=0x30733183
      export CAPELLA_FORK_VERSION=0x40733183
      export DENEB_FORK_VERSION=0x50733183
      export ELECTRA_FORK_VERSION=0x60733183
      export FULU_FORK_VERSION=0x70733183
      export GLOAS_FORK_VERSION=0x80733183
      export GENESIS_TIMESTAMP=$(date +%s)
      export GENESIS_DELAY=20
      export GENESIS_GASLIMIT=60000000
      export WITHDRAWAL_TYPE=0x02
      export BPO_1_EPOCH=0
      export BPO_2_EPOCH=0
      export GAS_LIMIT_SCHEDULE='[{"epoch":1566,"gas_limit":200000000}]'
      # Gloas-at-genesis currently produces a beacon state that Teku rejects
      # (the genesis block root differs from the state's latest-block root).
      # Epoch 1 is the earliest known-working devnet-8 activation; the experiment
      # waits for this fork before starting op-deployer.
      export GLOAS_FORK_EPOCH=1

services:
  # Genesis generator - creates all config files
  genesis:
    image: *ethereum-genesis-generator-image
    container_name: genesis
    profiles: ["l1"]
    command: all
    configs:
      - source: values-env
        target: /config/values.env
    volumes:
      - genesis-data:/data

  # Execution Layer - Geth
  geth:
    image: *geth-image
    container_name: geth
    profiles: ["l1"]
    command:
      - --datadir=/execution-data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,debug,txpool,engine,admin,personal
      - --http.corsdomain=*
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=eth,net,web3,debug,txpool,engine
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/genesis-data/metadata/jwtsecret
      - --syncmode=full
      - --gcmode=archive
      - --nodiscover
      - --maxpeers=0
      - --verbosity=3
      - --miner.gasprice=1
      - --miner.recommit=100ms
      - --rpc.allow-unprotected-txs
      # op-deployer PR #21728 delegates gas estimation to L1. Disable Geth's
      # lower default RPC gas cap so estimation can use the full block gas limit.
      - --rpc.gascap=0
    ports:
      - "8545:8545"
      - "8546:8546"
      - "8551:8551"
    volumes:
      - geth-data:/execution-data
      - genesis-data:/genesis-data
    depends_on:
      geth-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8545"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Initialize Geth
  geth-init:
    image: *geth-image
    container_name: geth-init
    profiles: ["l1"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -d /execution-data/geth ]; then
          geth init --datadir=/execution-data /genesis-data/metadata/genesis.json
        fi
    volumes:
      - geth-data:/execution-data
      - genesis-data:/genesis-data
    depends_on:
      genesis:
        condition: service_completed_successfully

  # Consensus Layer - Teku (replaces Lighthouse)
  #
  # Why not Lighthouse: Lighthouse's getBlobs / blob_sidecars beacon-API handlers
  # cannot serve blobs for post-Gloas (ePBS) blocks. They read blob_kzg_commitments
  # from the beacon block body, but Gloas removes that field from the body (the
  # commitments move into the SignedExecutionPayloadBid), so the handlers return
  # HTTP 400 "block is pre-Deneb and has no blobs" and op-node's L2 derivation
  # stalls at the fork boundary. A cross-client code audit showed Teku, Prysm,
  # Lodestar and Grandine all source the commitments from the payload bid and
  # reconstruct blobs from PeerDAS data columns; Lighthouse and Nimbus do not.
  # Teku is used here because the genesis tooling emits ready-to-use teku-keys/
  # + teku-secrets/ (no wallet import) and Teku runs the validator client
  # in-process, so it cleanly replaces both lighthouse and lighthouse-vc.
  teku:
    image: *teku-image
    container_name: teku
    profiles: ["l1"]
    # Run as root so Teku can write its DB/logs to the root-owned named volume.
    user: root
    environment:
      - JAVA_OPTS=-Xmx8g
    command:
      - --data-path=/consensus-data
      - --log-destination=CONSOLE
      - --network=/genesis-data/metadata/config.yaml
      - --initial-state=/genesis-data/metadata/genesis.ssz
      - --ee-endpoint=http://geth:8551
      - --ee-jwt-secret-file=/genesis-data/metadata/jwtsecret
      - --ignore-weak-subjectivity-period-enabled=true
      - --data-storage-mode=archive
      - --p2p-enabled=true
      - --p2p-discovery-enabled=false
      - --p2p-peer-lower-bound=0
      # Custody all PeerDAS data columns (supernode) so this sole producer retains
      # every column for its own blocks and can reconstruct/serve full blobs.
      - --p2p-subscribe-all-custody-subnets-enabled=true
      - --rest-api-enabled=true
      - --rest-api-interface=0.0.0.0
      - --rest-api-port=5052
      - --rest-api-host-allowlist=*
      - --rest-api-cors-origins=*
      # In-process validator client (replaces lighthouse-vc). teku-keys/teku-secrets
      # are pre-generated by eth2-val-tools in the exact <pubkey>.json:<pubkey>.txt
      # layout Teku's --validator-keys expects.
      - --validator-keys=/validator-keys/keys/teku-keys:/validator-keys/keys/teku-secrets
      - --validators-proposer-default-fee-recipient=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      - --logging=INFO
    ports:
      - "5052:5052"
      - "9000:9000"
    volumes:
      - teku-data:/consensus-data
      - genesis-data:/genesis-data
      - validator-keys:/validator-keys
    depends_on:
      geth:
        condition: service_healthy
      genesis:
        condition: service_completed_successfully
      validator-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  # Generate validator keys
  validator-keygen:
    image: *ethereum-genesis-generator-image
    container_name: validator-keygen
    profiles: ["l1"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        source /defaults/defaults.env
        source /values.env
        eth2-val-tools \
          keystores \
          --insecure \
          --out-loc /validator-keys/keys \
          --source-min 0 \
          --source-max "$$NUMBER_OF_VALIDATORS" \
          --source-mnemonic "$$EL_AND_CL_MNEMONIC"
    configs:
      - source: values-env
        target: /values.env
    volumes:
      - validator-keys:/validator-keys

  # Serves genesis.json (and other metadata) over HTTP
  genesis-server:
    image: *python-image
    container_name: genesis-server
    platform: linux/amd64
    profiles: ["l1"]
    command: python -m http.server 8080 --directory /genesis-data/metadata
    ports:
      - "8080:8080"
    volumes:
      - genesis-data:/genesis-data
    depends_on:
      genesis:
        condition: service_completed_successfully
    restart: unless-stopped

  # Several images here (blob-archiver, blob-api, op-node) are Chainguard
  # "static" builds with no shell/coreutils, but their entrypoints need one
  # (to read a resolved value or preprocess a file before exec'ing the real
  # binary). A static busybox is extracted here into a shared volume so it can
  # be bind-mounted into those containers as a minimal shell.
  # Also chowns blob-data to the blob-archiver image's nonroot uid (65532),
  # since named volumes default to root-owned and the image can't write to
  # /data otherwise.
  busybox-tools:
    image: busybox:musl
    platform: linux/amd64
    container_name: busybox-tools
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp /bin/busybox /tools/busybox
        chown -R 65532:65532 /data
    volumes:
      - shell-tools:/tools
      - blob-data:/data

  # L1 Beacon readiness check - exits when Teku's beacon HTTP API responds
  l1-beacon-ready:
    image: *python-image
    container_name: l1-beacon-ready
    platform: linux/amd64
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Teku beacon API..."
        until wget -qO /dev/null ${L1_BEACON_URL:-http://teku:5052}/eth/v1/beacon/headers/genesis 2>/dev/null; do
          sleep 2
        done
        echo "Teku beacon API is ready."

  # Resolves the L1 beacon genesis block root and writes it to a shared volume.
  # blob-archiver needs this value but its image has no shell to compute it.
  l1-beacon-root:
    image: *python-image
    container_name: l1-beacon-root
    platform: linux/amd64
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        wget -qO /tmp/genesis.json ${L1_BEACON_URL:-http://teku:5052}/eth/v1/beacon/headers/genesis
        GENESIS_ROOT=$$(sed 's/.*"root":"\([^"]*\)".*/\1/' /tmp/genesis.json)
        echo "Genesis block root: $$GENESIS_ROOT"
        echo -n "$$GENESIS_ROOT" > /shared/genesis-root.txt
    volumes:
      - shell-tools:/shared
    depends_on:
      l1-beacon-ready:
        condition: service_completed_successfully

  # Blob Archiver - archives blobs from the beacon chain to local storage
  blob-archiver:
    image: *blob-archiver-image
    platform: linux/amd64
    container_name: blob-archiver
    profiles: ["l2"]
    entrypoint: ["/shared/busybox", "sh", "-c"]
    command:
      - |
        set -e
        export BLOB_ARCHIVER_ORIGIN_BLOCK=$$(/shared/busybox cat /shared/genesis-root.txt)
        echo "Using origin block: $$BLOB_ARCHIVER_ORIGIN_BLOCK"
        exec /usr/local/bin/blob-archiver
    environment:
      - BLOB_ARCHIVER_L1_BEACON_HTTP=${L1_BEACON_URL:-http://teku:5052}
      - BLOB_ARCHIVER_DATA_STORE=file
      - BLOB_ARCHIVER_FILE_DIRECTORY=/data
      - BLOB_ARCHIVER_METRICS_ENABLED=true
      - BLOB_ARCHIVER_METRICS_PORT=7300
    volumes:
      - blob-data:/data
      - shell-tools:/shared:ro
    depends_on:
      busybox-tools:
        condition: service_completed_successfully
      l1-beacon-root:
        condition: service_completed_successfully
    restart: unless-stopped

  # Blob API - serves archived blobs over HTTP for OP Stack derivation
  # Needs no computed values, so it execs its binary directly - no shell needed.
  blob-api:
    image: *blob-archiver-image
    platform: linux/amd64
    container_name: blob-api
    profiles: ["l2"]
    command: ["/usr/local/bin/blob-api"]
    environment:
      - BLOB_API_L1_BEACON_HTTP=${L1_BEACON_URL:-http://teku:5052}
      - BLOB_API_DATA_STORE=file
      - BLOB_API_FILE_DIRECTORY=/data
      - BLOB_API_METRICS_ENABLED=true
      - BLOB_API_METRICS_PORT=7301
    ports:
      - "5058:8000"
    volumes:
      - blob-data:/data
      - shell-tools:/shared:ro
    depends_on:
      busybox-tools:
        condition: service_completed_successfully
      blob-archiver:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/shared/busybox",
          "wget",
          "-qO",
          "-",
          "http://localhost:8000/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== L2 Deploy Services ==========

  # Bootstrap superchain contracts on L1
  # Assumes that the deterministic deployer is present on L1.
  # The ethpandaops genesis generator embeds the deterministic deployer in genesis by default.
  bootstrap-superchain:
    image: *op-deployer-image
    platform: linux/amd64
    container_name: bootstrap-superchain
    profiles: ["l2"]
    command:
      - op-deployer
      - bootstrap
      - superchain
      - --l1-rpc-url=${L1_RPC_URL:-http://geth:8545}
      - --private-key=${DEPLOYER_ACCOUNT:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      - --outfile=/deployments/superchain.json
      - --superchain-proxy-admin-owner=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      - --guardian=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
    volumes:
      - deployments:/deployments
    depends_on:
      l1-el-ready:
        condition: service_completed_successfully

  # Bootstrap OP Stack implementation contracts on L1
  bootstrap-implementations:
    image: *op-deployer-image
    platform: linux/amd64
    container_name: bootstrap-implementations
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Bootstrap Implementations ==="
        SUPERCHAIN_CONFIG_PROXY=$$(grep '"superchainConfigProxyAddress"' /deployments/superchain.json | sed 's/.*: *"\([^"]*\)".*/\1/')
        SUPERCHAIN_PROXY_ADMIN=$$(grep '"proxyAdminAddress"' /deployments/superchain.json | sed 's/.*: *"\([^"]*\)".*/\1/')
        echo "SuperchainConfigProxy: $$SUPERCHAIN_CONFIG_PROXY"
        echo "SuperchainProxyAdmin: $$SUPERCHAIN_PROXY_ADMIN"
        op-deployer bootstrap implementations \
          --l1-rpc-url=${L1_RPC_URL:-http://geth:8545} \
          --private-key=${DEPLOYER_ACCOUNT:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80} \
          --outfile=/deployments/implementations.json \
          --superchain-config-proxy=$$SUPERCHAIN_CONFIG_PROXY \
          --superchain-proxy-admin=$$SUPERCHAIN_PROXY_ADMIN \
          --upgrade-controller=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 \
          --challenger=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
        echo "Implementations bootstrap complete:"
        cat /deployments/implementations.json
    volumes:
      - deployments:/deployments
    depends_on:
      bootstrap-superchain:
        condition: service_completed_successfully

  # Initialize L2 deployment: scaffold intent and patch config
  l2-deploy-init:
    image: *op-deployer-image
    platform: linux/amd64
    container_name: l2-deploy-init
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== L2 Deploy Init ==="
        OPCM_ADDRESS=$$(grep '"opcmV2Address"' /deployments/implementations.json | sed 's/.*: *"\([^"]*\)".*/\1/')
        SUPERCHAIN_CONFIG_PROXY=$$(grep '"superchainConfigProxyAddress"' /deployments/superchain.json | sed 's/.*: *"\([^"]*\)".*/\1/')
        echo "OPCM address: $$OPCM_ADDRESS"
        echo "Superchain config proxy: $$SUPERCHAIN_CONFIG_PROXY"
        CHAIN_ID_HEX=$$(wget -qO- --post-data='{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
          --header='Content-Type: application/json' ${L1_RPC_URL:-http://geth:8545} | \
          sed 's/.*"result":"\([^"]*\)".*/\1/')
        L1_CHAIN_ID=$$(printf "%d" "$$CHAIN_ID_HEX")
        echo "L1 chain ID: $$L1_CHAIN_ID"
        L2_CHAIN_ID_HEX=$$(printf "0x%064x" ${L2_CHAIN_ID:-420120214})
        op-deployer init \
          --l1-chain-id "$$L1_CHAIN_ID" \
          --l2-chain-ids ${L2_CHAIN_ID:-420120214} \
          --workdir /l2-data \
          --intent-type custom
        L1_LOCATOR=$$(grep '^l1ContractsLocator' /l2-data/intent.toml | sed 's/l1ContractsLocator = "\(.*\)"/\1/')
        L2_LOCATOR=$$(grep '^l2ContractsLocator' /l2-data/intent.toml | sed 's/l2ContractsLocator = "\(.*\)"/\1/')
        echo "L1 locator: $$L1_LOCATOR"
        echo "L2 locator: $$L2_LOCATOR"
        cat > /l2-data/intent.toml <<TOML
        configType = "custom"
        l1ChainID = $$L1_CHAIN_ID
        l1ContractsLocator = "$$L1_LOCATOR"
        l2ContractsLocator = "$$L2_LOCATOR"
        fundDevAccounts = true
        useInterop = false
        opcmAddress = "$$OPCM_ADDRESS"
        superchainConfigProxy = "$$SUPERCHAIN_CONFIG_PROXY"

        [[chains]]
        id = "$$L2_CHAIN_ID_HEX"
        baseFeeVaultRecipient = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        l1FeeVaultRecipient = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        sequencerFeeVaultRecipient = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        operatorFeeVaultRecipient = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        eip1559Denominator = 50
        eip1559DenominatorCanyon = 250
        eip1559Elasticity = 6
        gasLimit = 60_000_000
        operatorFeeScalar = 0
        operatorFeeConstant = 0
        minBaseFee = 0
        daFootprintGasScalar = 0

        [chains.roles]
        l1ProxyAdminOwner = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        l2ProxyAdminOwner = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        systemConfigOwner = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        unsafeBlockSigner = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
        batcher = "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC"
        proposer = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
        challenger = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"

        [globalDeployOverrides]
        l2BlockTime = 1
        l2GenesisKarstTimeOffset = "0x0"
        TOML
        echo "intent.toml written:"
        cat /l2-data/intent.toml
    volumes:
      - deployments:/deployments:ro
      - l2-data:/l2-data
    depends_on:
      bootstrap-implementations:
        condition: service_completed_successfully

  # Deploy L2 chain contracts to L1
  l2-deploy-apply:
    image: *op-deployer-image
    platform: linux/amd64
    container_name: l2-deploy-apply
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== L2 Deploy Apply ==="
        op-deployer apply \
          --workdir /l2-data \
          --l1-rpc-url ${L1_RPC_URL:-http://geth:8545} \
          --private-key ${DEPLOYER_ACCOUNT:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
        echo "L2 contracts deployed successfully"
    volumes:
      - l2-data:/l2-data
    depends_on:
      l2-deploy-init:
        condition: service_completed_successfully

  # Extract genesis, rollup config, and generate JWT
  l2-deploy-inspect:
    image: *op-deployer-image
    platform: linux/amd64
    container_name: l2-deploy-inspect
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== L2 Deploy Inspect ==="
        op-deployer inspect genesis \
          --workdir /l2-data \
          ${L2_CHAIN_ID:-420120214} > /l2-data/genesis.json
        echo "Genesis written to /l2-data/genesis.json"
        op-deployer inspect rollup \
          --workdir /l2-data \
          ${L2_CHAIN_ID:-420120214} > /l2-data/rollup.json
        echo "Rollup config written to /l2-data/rollup.json"
        od -A n -t x1 -N 32 /dev/urandom | tr -d ' \n' > /l2-data/jwt.txt
        echo ""
        echo "JWT secret written to /l2-data/jwt.txt"
    volumes:
      - l2-data:/l2-data
    depends_on:
      l2-deploy-apply:
        condition: service_completed_successfully

  # Fund sequencer and batcher accounts on L1
  l2-fund-accounts:
    image: *foundry-image
    container_name: l2-fund-accounts
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Funding L2 Accounts ==="
        cast send 0x70997970C51812dc3A010C7d01b50e0d17dc79C8 \
          --value 100ether \
          --private-key ${DEPLOYER_ACCOUNT:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80} \
          --rpc-url ${L1_RPC_URL:-http://geth:8545}
        echo "Funded sequencer (0x70997970C51812dc3A010C7d01b50e0d17dc79C8) with 100 ETH"
        cast send 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC \
          --value 100ether \
          --private-key ${DEPLOYER_ACCOUNT:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80} \
          --rpc-url ${L1_RPC_URL:-http://geth:8545}
        echo "Funded batcher (0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC) with 100 ETH"
        echo "L2 deployment complete!"
    depends_on:
      l2-deploy-inspect:
        condition: service_completed_successfully

  # ========== L2 Runtime Services (OP Stack) ==========

  # Initialize op-reth with L2 genesis
  op-reth-init:
    image: *op-reth-image
    container_name: op-reth-init
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        op-reth init --chain /l2-data/genesis.json --datadir /l2-execution-data
    volumes:
      - op-reth-data:/l2-execution-data
      - l2-data:/l2-data:ro
    depends_on:
      l2-fund-accounts:
        condition: service_completed_successfully

  # L2 Execution Engine - op-reth
  op-reth:
    image: *op-reth-image
    container_name: op-reth
    profiles: ["l2"]
    command:
      - node
      - --chain=/l2-data/genesis.json
      - --datadir=/l2-execution-data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=9545
      - --http.api=eth,net,web3,debug,txpool,miner
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=9546
      - --ws.api=eth,net,web3,debug,txpool,miner
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=9551
      - --authrpc.jwtsecret=/l2-data/jwt.txt
      - --rollup.disable-tx-pool-gossip
      - --disable-discovery
    ports:
      - "9545:9545"
      - "9546:9546"
      - "9551:9551"
    volumes:
      - op-reth-data:/l2-execution-data
      - l2-data:/l2-data:ro
      - shell-tools:/shared:ro
    depends_on:
      op-reth-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/shared/busybox",
          "wget",
          "-q",
          "-O",
          "-",
          "--header=Content-Type: application/json",
          '--post-data={"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}',
          "http://localhost:9545",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  # L2 Consensus / Derivation - op-node
  # op-node's image is also Chainguard "static" (no shell) - same borrowed-
  # busybox trick as blob-archiver.
  op-node:
    image: *op-node-image
    container_name: op-node
    profiles: ["l2"]
    entrypoint: ["/shared/busybox", "sh", "-c"]
    environment:
      - L1_CHAIN_CONFIG=${L1_CHAIN_CONFIG:-/genesis-data/metadata/genesis.json}
    command:
      - |
        set -e
        if echo "$$L1_CHAIN_CONFIG" | /shared/busybox grep -q '^http'; then
          /shared/busybox wget -qO /tmp/l1-genesis-raw.json "$$L1_CHAIN_CONFIG"
          /shared/busybox sed '/"terminalTotalDifficultyPassed"/d' /tmp/l1-genesis-raw.json > /tmp/l1-genesis.json
          L1_CONFIG_FLAG="--rollup.l1-chain-config=/tmp/l1-genesis.json"
        elif [ -f "$$L1_CHAIN_CONFIG" ]; then
          /shared/busybox sed '/"terminalTotalDifficultyPassed"/d' "$$L1_CHAIN_CONFIG" > /tmp/l1-genesis.json
          L1_CONFIG_FLAG="--rollup.l1-chain-config=/tmp/l1-genesis.json"
        else
          L1_CONFIG_FLAG=""
        fi
        exec op-node \
          --l1=${L1_RPC_URL:-http://geth:8545} \
          --l1.beacon=${L1_BEACON_URL:-http://teku:5052} \
          --l2=http://op-reth:9551 \
          --l2.jwt-secret=/l2-data/jwt.txt \
          --rollup.config=/l2-data/rollup.json \
          --rpc.addr=0.0.0.0 \
          --rpc.port=8547 \
          --sequencer.enabled \
          --p2p.sequencer.key=59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
          --p2p.priv.raw=1111111111111111111111111111111111111111111111111111111111111111 \
          --p2p.listen.ip=0.0.0.0 \
          --p2p.listen.tcp=9222 \
          --p2p.no-discovery \
          --p2p.peerstore.path=memory \
          --p2p.discovery.path=memory \
          --l1.trustrpc \
          $$L1_CONFIG_FLAG
    ports:
      - "8547:8547"
    volumes:
      - l2-data:/l2-data:ro
      - genesis-data:/genesis-data:ro
      - shell-tools:/shared:ro
    depends_on:
      busybox-tools:
        condition: service_completed_successfully
      l2-el-ready:
        condition: service_completed_successfully
    restart: unless-stopped

  # L2 Batch Submitter - op-batcher
  op-batcher:
    image: *op-batcher-image
    container_name: op-batcher
    profiles: ["l2"]
    command:
      - op-batcher
      - --l1-eth-rpc=${L1_RPC_URL:-http://geth:8545}
      - --l2-eth-rpc=http://op-reth:9545
      - --rollup-rpc=http://op-node:8547
      - --private-key=0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a
      - --data-availability-type=blobs
      - --max-channel-duration=1
      - --poll-interval=1s
      - --num-confirmations=1
      - --sub-safety-margin=4
      - --wait-node-sync=false
      - --rpc.addr=0.0.0.0
      - --rpc.port=8548
    ports:
      - "8548:8548"
    depends_on:
      op-node:
        condition: service_started
    restart: unless-stopped

  # L1 EL readiness check. The experiment starts the l2 profile only after the
  # epoch-1 Amsterdam activation has occurred.
  l1-el-ready:
    image: *foundry-image
    container_name: l1-el-ready
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        RPC_URL=${L1_RPC_URL:-http://geth:8545}
        AMSTERDAM_TIME=""
        if [ "$$RPC_URL" = "http://geth:8545" ]; then
          echo "Waiting for local L1 genesis metadata..."
          until [ -f /genesis-data/metadata/genesis.json ]; do sleep 1; done
          AMSTERDAM_TIME=$$(sed -n 's/.*"amsterdamTime": *\([0-9][0-9]*\).*/\1/p' /genesis-data/metadata/genesis.json)
          echo "Waiting for post-Amsterdam L1 EL (activation time $$AMSTERDAM_TIME)..."
        else
          echo "Waiting for external L1 EL..."
        fi
        while true; do
          BLOCK=$$(cast block-number --rpc-url "$$RPC_URL" 2>/dev/null || echo "0")
          LATEST_TIME=$$(cast block latest --field timestamp --rpc-url "$$RPC_URL" 2>/dev/null || echo "0")
          if [ -n "$$BLOCK" ] && [ "$$BLOCK" -gt 0 ] 2>/dev/null; then
            if [ -n "$$AMSTERDAM_TIME" ] && [ "$$LATEST_TIME" -lt "$$AMSTERDAM_TIME" ]; then
              echo "L1 block $$BLOCK is pre-Amsterdam (timestamp $$LATEST_TIME); waiting..."
            elif cast logs --from-block 1 --to-block 1 --rpc-url "$$RPC_URL" >/dev/null 2>&1; then
              echo "L1 EL is ready at block $$BLOCK (timestamp $$LATEST_TIME)."
              exit 0
            else
              echo "Block $$BLOCK exists; waiting for indexing..."
            fi
          else
            echo "Waiting for block 1..."
          fi
          sleep 2
        done
    volumes:
      - genesis-data:/genesis-data:ro

  # L2 EL readiness check - exits when op-reth RPC is responsive
  l2-el-ready:
    image: *foundry-image
    container_name: l2-el-ready
    profiles: ["l2"]
    depends_on:
      op-reth:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for L2 EL to be ready..."
        while true; do
          if cast block-number --rpc-url http://op-reth:9545 2>/dev/null; then
            echo "L2 EL is ready."
            exit 0
          fi
          echo "Waiting for op-reth..."
          sleep 2
        done

  # ---------------------------------------------------------------------------
  # L2 follower / verifier node (second op-reth + op-node pair).
  #
  # op-reth-2 is a plain follower execution engine. op-node-2 is a *verifier*
  # (no --sequencer.enabled): it derives the safe chain independently from L1
  # and receives the unsafe chain via libp2p gossip from the sequencer op-node.
  # This lets check-glamsterdam prove that both L2 nodes advance in lockstep on
  # the unsafe AND safe chains across the Glamsterdam fork boundary.
  # ---------------------------------------------------------------------------
  op-reth-2-init:
    image: *op-reth-image
    container_name: op-reth-2-init
    profiles: ["l2"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        op-reth init --chain /l2-data/genesis.json --datadir /l2-execution-data
    volumes:
      - op-reth-2-data:/l2-execution-data
      - l2-data:/l2-data:ro
    depends_on:
      l2-fund-accounts:
        condition: service_completed_successfully

  op-reth-2:
    image: *op-reth-image
    container_name: op-reth-2
    profiles: ["l2"]
    command:
      - node
      - --chain=/l2-data/genesis.json
      - --datadir=/l2-execution-data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=9545
      - --http.api=eth,net,web3,debug,txpool,miner
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=9546
      - --ws.api=eth,net,web3,debug,txpool,miner
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=9551
      - --authrpc.jwtsecret=/l2-data/jwt.txt
      - --rollup.disable-tx-pool-gossip
      - --disable-discovery
    ports:
      - "9645:9545"
      - "9646:9546"
      - "9651:9551"
    volumes:
      - op-reth-2-data:/l2-execution-data
      - l2-data:/l2-data:ro
      - shell-tools:/shared:ro
    depends_on:
      op-reth-2-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "/shared/busybox",
          "wget",
          "-q",
          "-O",
          "-",
          "--header=Content-Type: application/json",
          '--post-data={"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}',
          "http://localhost:9545",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  l2-el-ready-2:
    image: *foundry-image
    container_name: l2-el-ready-2
    profiles: ["l2"]
    depends_on:
      op-reth-2:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for L2 follower EL to be ready..."
        while true; do
          if cast block-number --rpc-url http://op-reth-2:9545 2>/dev/null; then
            echo "L2 follower EL is ready."
            exit 0
          fi
          echo "Waiting for op-reth-2..."
          sleep 2
        done

  # op-node-2 - L2 follower/verifier consensus node.
  op-node-2:
    image: *op-node-image
    container_name: op-node-2
    profiles: ["l2"]
    entrypoint: ["/shared/busybox", "sh", "-c"]
    environment:
      - L1_CHAIN_CONFIG=${L1_CHAIN_CONFIG:-/genesis-data/metadata/genesis.json}
    command:
      - |
        set -e
        if echo "$$L1_CHAIN_CONFIG" | /shared/busybox grep -q '^http'; then
          /shared/busybox wget -qO /tmp/l1-genesis-raw.json "$$L1_CHAIN_CONFIG"
          /shared/busybox sed '/"terminalTotalDifficultyPassed"/d' /tmp/l1-genesis-raw.json > /tmp/l1-genesis.json
          L1_CONFIG_FLAG="--rollup.l1-chain-config=/tmp/l1-genesis.json"
        elif [ -f "$$L1_CHAIN_CONFIG" ]; then
          /shared/busybox sed '/"terminalTotalDifficultyPassed"/d' "$$L1_CHAIN_CONFIG" > /tmp/l1-genesis.json
          L1_CONFIG_FLAG="--rollup.l1-chain-config=/tmp/l1-genesis.json"
        else
          L1_CONFIG_FLAG=""
        fi
        # Discover the sequencer op-node's libp2p peer ID via its opp2p_self RPC,
        # then static-peer to it so this follower receives the unsafe chain by
        # gossip. The retry loop tolerates the sequencer's P2P RPC not being up yet.
        PEERID=""
        i=0
        while [ -z "$$PEERID" ] && [ $$i -lt 60 ]; do
          RESP=$$(/shared/busybox wget -qO- \
            --header='Content-Type: application/json' \
            --post-data='{"jsonrpc":"2.0","method":"opp2p_self","params":[],"id":1}' \
            http://op-node:8547 2>/dev/null || true)
          PEERID=$$(echo "$$RESP" | /shared/busybox sed -n 's/.*"peerID":"\([^"]*\)".*/\1/p')
          [ -n "$$PEERID" ] && break
          echo "waiting for sequencer op-node peerID..."
          /shared/busybox sleep 2
          i=$$((i+1))
        done
        if [ -z "$$PEERID" ]; then echo "could not obtain sequencer peerID" >&2; exit 1; fi
        echo "sequencer peerID: $$PEERID"
        exec op-node \
          --l1=${L1_RPC_URL:-http://geth:8545} \
          --l1.beacon=${L1_BEACON_URL:-http://teku:5052} \
          --l2=http://op-reth-2:9551 \
          --l2.jwt-secret=/l2-data/jwt.txt \
          --rollup.config=/l2-data/rollup.json \
          --rpc.addr=0.0.0.0 \
          --rpc.port=8547 \
          --p2p.priv.raw=2222222222222222222222222222222222222222222222222222222222222222 \
          --p2p.listen.ip=0.0.0.0 \
          --p2p.listen.tcp=9222 \
          --p2p.no-discovery \
          --p2p.peerstore.path=memory \
          --p2p.discovery.path=memory \
          --p2p.static=/dns4/op-node/tcp/9222/p2p/$$PEERID \
          --l1.trustrpc \
          $$L1_CONFIG_FLAG
    ports:
      - "8647:8547"
    volumes:
      - l2-data:/l2-data:ro
      - genesis-data:/genesis-data:ro
      - shell-tools:/shared:ro
    depends_on:
      busybox-tools:
        condition: service_completed_successfully
      l2-el-ready-2:
        condition: service_completed_successfully
      op-node:
        condition: service_started
    restart: unless-stopped

  # Sustained native transfers for the transition test. The sequencer account is
  # one of op-deployer's funded dev accounts in the generated L2 genesis.
  transfer-spammer:
    image: *foundry-image
    container_name: transfer-spammer
    profiles: ["test"]
    entrypoint: ["/bin/sh", "/scripts/spam-transfers.sh"]
    environment:
      - RPC_URL=http://op-reth:9545
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      op-node:
        condition: service_started

  # Exits successfully once both the sequencer and verifier have matching unsafe
  # and safe heads derived from a post-Amsterdam L1 origin under transfer load.
  glamsterdam-check:
    image: *python-image
    container_name: glamsterdam-check
    profiles: ["test"]
    command: ["python", "/scripts/check-glamsterdam.py"]
    volumes:
      - ./scripts:/scripts:ro
      - genesis-data:/genesis-data:ro
    depends_on:
      transfer-spammer:
        condition: service_started
      op-node-2:
        condition: service_started

volumes:
  genesis-data:
  geth-data:
  teku-data:
  validator-keys:
  blob-data:
  shell-tools:
  deployments:
  l2-data:
  op-reth-data:
  op-reth-2-data:
